{% macro password_field(name, field_id, label, placeholder='', required=true, autocomplete='', label_class='form-label', wrapper_class='mb-3', input_class='') %}
<div class="{{ wrapper_class }}">
    {% if label %}
    <label class="{{ label_class }}" for="{{ field_id }}">{{ label }}</label>
    {% endif %}
    <div class="password-input-wrap">
        <input
            type="password"
            id="{{ field_id }}"
            name="{{ name }}"
            class="form-control password-input {{ input_class }}"
            placeholder="{{ placeholder }}"
            {% if required %}required{% endif %}
            {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
        >
        <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password">
            <i class="fa-regular fa-eye" aria-hidden="true"></i>
        </button>
    </div>
</div>
{% endmacro %}
