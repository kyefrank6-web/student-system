# Web service only — free tier allows one Postgres DB per account.
# Link DATABASE_URL to your existing Render Postgres after deploy
# (Dashboard → campuspass → Environment → DATABASE_URL).

services:
  - type: web
    name: campuspass
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
